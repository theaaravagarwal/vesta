name: Behavior regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q behavior evaluation scripts
      - run: node --check static/review.js
